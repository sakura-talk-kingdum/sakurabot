<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 ガチャダッシュボード</title>

<style>
body {
  font-family: system-ui;
  background: #f0f2f5;
  margin: 0;
}

header {
  background: #5865F2;
  color: #fff;
  padding: 14px;
  font-size: 1.3rem;
}

main {
  padding: 20px;
}

.set {
  background: #fff;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 20px;
}

.items {
  margin-top: 10px;
  padding-left: 10px;
}

.item {
  background: #fafafa;
  padding: 8px;
  border-radius: 6px;
  margin: 6px 0;
}

input,
select,
button {
  padding: 6px;
  margin: 2px;
}

button {
  cursor: pointer;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

small {
  color: #666;
}

.status {
  margin: 10px 0;
  padding: 10px;
  border-radius: 6px;
  display: none;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}
</style>

</head>

<body>

<header>🎰 ガチャダッシュボード</header>

<main>

<div id="status" class="status"></div>

<h3>ガチャセット作成</h3>

<input id="new-name" placeholder="セット名">
<input id="new-channel" placeholder="チャンネルID">
<input id="new-trigger" placeholder="トリガー">

<button onclick="createSet()">作成</button>

<hr>

<div id="sets"></div>

</main>

<script>

const API = '/gachas';
const $ = id => document.getElementById(id);

let csrfToken = null;

/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type = 'success') {
  const el = $('status');

  el.textContent = message;
  el.className = `status ${type}`;

  setTimeout(() => {
    el.className = 'status';
  }, 3000);
}

/* =========================================================
   CSRF
========================================================= */

async function loadCsrfToken() {

  const res = await fetch(`${API}/csrf-token`, {
    method: 'GET',
    credentials: 'include'
  });

  if (!res.ok) {
    throw new Error(`CSRFトークン取得失敗: HTTP ${res.status}`);
  }

  const data = await res.json();

  if (!data.csrfToken) {
    throw new Error('CSRFトークンが取得できませんでした');
  }

  csrfToken = data.csrfToken;

  return csrfToken;
}

/* =========================================================
   CSRF FETCH
========================================================= */

async function csrfFetch(url, options = {}) {

  if (!csrfToken) {
    await loadCsrfToken();
  }

  const headers = new Headers(options.headers || {});
  headers.set('CSRF-Token', csrfToken);

  if (
    options.body &&
    typeof options.body === 'string' &&
    !headers.has('Content-Type')
  ) {
    headers.set('Content-Type', 'application/json');
  }

  let res = await fetch(url, {
    ...options,
    headers,
    credentials: 'include'
  });

  if (res.status === 403) {

    try {

      const cloned = res.clone();
      const data = await cloned.json();

      if (
        data?.error === 'invalid csrf token' ||
        data?.code === 'EBADCSRFTOKEN'
      ) {

        await loadCsrfToken();

        headers.set('CSRF-Token', csrfToken);

        res = await fetch(url, {
          ...options,
          headers,
          credentials: 'include'
        });
      }

    } catch {}
  }

  return res;
}

/* =========================================================
   RESPONSE CHECK
========================================================= */

async function checkResponse(res) {

  if (res.ok) return true;

  let message = `HTTP ${res.status}`;

  try {
    const data = await res.json();
    if (data?.error) message = data.error;
    else if (data?.message) message = data.message;
  } catch {}

  throw new Error(message);
}

/* =========================================================
   SETS
========================================================= */

async function loadSets() {

  try {

    const res = await fetch(`${API}/sets`, {
      credentials: 'include'
    });

    await checkResponse(res);

    const sets = await res.json();

    $('sets').innerHTML = '';

    for (const s of sets) {
      $('sets').insertAdjacentHTML('beforeend', renderSet(s));
      loadItems(s.id);
    }

  } catch (error) {
    showStatus(`セット取得に失敗しました: ${error.message}`, 'error');
  }
}

function renderSet(s) {

  return `
  <div class="set" id="set-${s.id}">

    <b>${escapeHtml(s.name)}</b>
    <small>(${escapeHtml(s.channel_id)} / ${escapeHtml(s.trigger_word)})</small>

    <div class="toggle">
      <label>有効</label>
      <input type="checkbox"
        ${s.enabled ? 'checked' : ''}
        onchange="toggleSet('${s.id}', this.checked)">
    </div>

    <div>
      <input id="sname-${s.id}" value="${escapeAttr(s.name)}">
      <input id="sch-${s.id}" value="${escapeAttr(s.channel_id)}">
      <input id="str-${s.id}" value="${escapeAttr(s.trigger_word)}">

      <button onclick="saveSet('${s.id}')">保存</button>
      <button onclick="deleteSet('${s.id}')">削除</button>
    </div>

    <div class="items" id="items-${s.id}"></div>

  </div>`;
}

/* =========================================================
   CREATE SET
========================================================= */

async function createSet() {

  const name = $('new-name').value.trim();
  const channel_id = $('new-channel').value.trim();
  const trigger_word = $('new-trigger').value.trim();

  if (!name || !channel_id || !trigger_word) {
    alert('必須項目を入力してください');
    return;
  }

  try {

    const res = await csrfFetch(`${API}/sets`, {
      method: 'POST',
      body: JSON.stringify({
        guild_id: '1208962938388484107',
        name,
        channel_id,
        trigger_word
      })
    });

    await checkResponse(res);

    $('new-name').value = '';
    $('new-channel').value = '';
    $('new-trigger').value = '';

    showStatus('作成しました');

    await loadSets();

  } catch (e) {
    showStatus(`作成失敗: ${e.message}`, 'error');
  }
}

/* =========================================================
   SAVE / TOGGLE / DELETE SET
========================================================= */

async function saveSet(id) {

  const body = {};

  const name = $(`sname-${id}`).value.trim();
  const channel_id = $(`sch-${id}`).value.trim();
  const trigger_word = $(`str-${id}`).value.trim();

  if (name) body.name = name;
  if (channel_id) body.channel_id = channel_id;
  if (trigger_word) body.trigger_word = trigger_word;

  if (!Object.keys(body).length) return;

  try {

    const res = await csrfFetch(`${API}/sets/${id}`, {
      method: 'PATCH',
      body: JSON.stringify(body)
    });

    await checkResponse(res);

    showStatus('保存しました');
    await loadSets();

  } catch (e) {
    showStatus(e.message, 'error');
  }
}

async function toggleSet(id, enabled) {

  try {

    const res = await csrfFetch(`${API}/sets/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ enabled })
    });

    await checkResponse(res);

    showStatus(enabled ? '有効化' : '無効化');

  } catch (e) {
    showStatus(e.message, 'error');
    await loadSets();
  }
}

async function deleteSet(id) {

  if (!confirm('削除しますか？')) return;

  try {

    const res = await csrfFetch(`${API}/sets/${id}`, {
      method: 'DELETE'
    });

    await checkResponse(res);

    showStatus('削除しました');
    await loadSets();

  } catch (e) {
    showStatus(e.message, 'error');
  }
}

/* =========================================================
   ITEMS
========================================================= */

async function loadItems(setId) {

  try {

    const res = await fetch(`${API}/sets/${setId}/items`, {
      credentials: 'include'
    });

    await checkResponse(res);

    const items = await res.json();

    const el = $(`items-${setId}`);
    el.innerHTML = '<b>アイテム</b>';

    for (const i of items) {

      el.insertAdjacentHTML('beforeend', `
        <div class="item">

          <input id="iname-${i.id}" value="${escapeAttr(i.name)}">
          <input id="idescription-${i.id}" value="${escapeAttr(i.description ?? '')}">
          <input id="iamount-${i.id}" type="number" value="${i.amount}">

          <select id="irarity-${i.id}">
            ${['common','uncommon','rare','epic','legend','superlegend']
              .map(r => `<option ${i.rarity===r?'selected':''}>${r}</option>`)
              .join('')}
          </select>

          <button onclick="saveItem('${setId}','${i.id}')">保存</button>
          <button onclick="deleteItem('${setId}','${i.id}')">削除</button>

        </div>
      `);
    }

  } catch (e) {
    showStatus(e.message, 'error');
  }
}

/* =========================================================
   ITEM OPS
========================================================= */

async function addItem(setId) { /* 省略（元のまま） */ }
async function saveItem(setId, itemId) { /* 省略（元のまま） */ }
async function deleteItem(setId, itemId) { /* 省略（元のまま） */ }

/* =========================================================
   UTIL
========================================================= */

function escapeHtml(v) {
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function escapeAttr(v) {
  return escapeHtml(v);
}

/* =========================================================
   INIT
========================================================= */

async function init() {
  await loadCsrfToken();
  await loadSets();
}

init();

</script>

</body>
</html>
