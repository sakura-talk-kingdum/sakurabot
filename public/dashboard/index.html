<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 ガチャダッシュボード</title>

<style>
body {
  font-family: system-ui;
  background: #f0f2f5;
  margin: 0;
}

header {
  background: #5865F2;
  color: #fff;
  padding: 14px;
  font-size: 1.3rem;
}

main {
  padding: 20px;
}

.set {
  background: #fff;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 20px;
}

.items {
  margin-top: 10px;
  padding-left: 10px;
}

.item {
  background: #fafafa;
  padding: 8px;
  border-radius: 6px;
  margin: 6px 0;
}

input,
select,
button {
  padding: 6px;
  margin: 2px;
}

button {
  cursor: pointer;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

small {
  color: #666;
}

.status {
  margin: 10px 0;
  padding: 10px;
  border-radius: 6px;
  display: none;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}
</style>
</head>

<body>

<header>🎰 ガチャダッシュボード</header>

<main>

<div id="status" class="status"></div>

<h3>ガチャセット作成</h3>

<input id="new-name" placeholder="セット名">
<input id="new-channel" placeholder="チャンネルID">
<input id="new-trigger" placeholder="トリガー">

<button onclick="createSet()">作成</button>

<hr>

<div id="sets"></div>

</main>

<script>

const API = '/gachas';

const GUILD_ID = '1208962938388484107';

const $ = id => document.getElementById(id);

let csrfToken = null;


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type = 'success') {

  const el = $('status');

  el.textContent = message;
  el.className = `status ${type}`;

  setTimeout(() => {
    el.className = 'status';
  }, 3000);
}


/* =========================================================
   CSRF
========================================================= */

async function loadCsrfToken() {

  const res = await fetch(`${API}/csrf-token`, {
    method: 'GET',
    credentials: 'include'
  });

  if (!res.ok) {
    throw new Error(
      `CSRFトークン取得失敗: HTTP ${res.status}`
    );
  }

  const data = await res.json();

  if (!data.csrfToken) {
    throw new Error('CSRFトークンが取得できませんでした');
  }

  csrfToken = data.csrfToken;

  return csrfToken;
}


async function csrfFetch(url, options = {}) {

  if (!csrfToken) {
    await loadCsrfToken();
  }

  const headers = new Headers(options.headers || {});

  headers.set('CSRF-Token', csrfToken);

  if (
    options.body &&
    typeof options.body === 'string' &&
    !headers.has('Content-Type')
  ) {
    headers.set('Content-Type', 'application/json');
  }

  let res = await fetch(url, {
    ...options,
    headers,
    credentials: 'include'
  });

  /*
   * CSRFトークンが古くなっていた場合、
   * 1回だけ再取得してリトライ
   */
  if (res.status === 403) {

    try {

      const data = await res.clone().json();

      if (
        data?.error === 'invalid csrf token' ||
        data?.code === 'EBADCSRFTOKEN'
      ) {

        await loadCsrfToken();

        headers.set('CSRF-Token', csrfToken);

        res = await fetch(url, {
          ...options,
          headers,
          credentials: 'include'
        });
      }

    } catch {
      // JSONでない403はそのまま返す
    }
  }

  return res;
}


/* =========================================================
   RESPONSE
========================================================= */

async function checkResponse(res) {

  if (res.ok) {
    return true;
  }

  let message = `HTTP ${res.status}`;

  try {

    const data = await res.json();

    if (data?.error) {
      message = data.error;
    } else if (data?.message) {
      message = data.message;
    }

  } catch {}

  throw new Error(message);
}


/* =========================================================
   SET
========================================================= */

async function loadSets() {

  try {

    const res = await fetch(`${API}/sets`, {
      credentials: 'include'
    });

    await checkResponse(res);

    const sets = await res.json();

    $('sets').innerHTML = '';

    for (const s of sets) {

      $('sets').insertAdjacentHTML(
        'beforeend',
        renderSet(s)
      );

      await loadItems(s.id);
    }

  } catch (error) {

    console.error(error);

    showStatus(
      `セット取得に失敗しました: ${error.message}`,
      'error'
    );
  }
}


function renderSet(s) {

  return `
  <div class="set" id="set-${escapeAttr(s.id)}">

    <b>${escapeHtml(s.name)}</b>

    <small>
      (${escapeHtml(s.channel_id)}
      /
      ${escapeHtml(s.trigger_word)})
    </small>

    <div class="toggle">

      <label>有効</label>

      <input
        type="checkbox"
        ${s.enabled ? 'checked' : ''}
        onchange="toggleSet('${escapeJs(s.id)}', this.checked)"
      >

    </div>

    <div>

      <input
        id="sname-${escapeAttr(s.id)}"
        placeholder="セット名"
        value="${escapeAttr(s.name)}"
      >

      <input
        id="sch-${escapeAttr(s.id)}"
        placeholder="チャンネルID"
        value="${escapeAttr(s.channel_id)}"
      >

      <input
        id="str-${escapeAttr(s.id)}"
        placeholder="トリガー"
        value="${escapeAttr(s.trigger_word)}"
      >

      <button onclick="saveSet('${escapeJs(s.id)}')">
        保存
      </button>

      <button onclick="deleteSet('${escapeJs(s.id)}')">
        削除
      </button>

    </div>


    <!-- =========================
         ITEMS
    ========================== -->

    <div
      class="items"
      id="items-${escapeAttr(s.id)}"
    >
      <b>アイテム</b>
    </div>


    <!-- =========================
         ADD ITEM
    ========================== -->

    <div>

      <input
        id="new-iname-${escapeAttr(s.id)}"
        placeholder="アイテム名"
      >

      <input
        id="new-idescription-${escapeAttr(s.id)}"
        placeholder="説明"
      >

      <input
        id="new-iamount-${escapeAttr(s.id)}"
        type="number"
        min="1"
        placeholder="個数"
      >

      <select
        id="new-irarity-${escapeAttr(s.id)}"
      >
        <option value="common">common</option>
        <option value="uncommon">uncommon</option>
        <option value="rare">rare</option>
        <option value="epic">epic</option>
        <option value="legend">legend</option>
        <option value="superlegend">superlegend</option>
      </select>

      <button onclick="addItem('${escapeJs(s.id)}')">
        追加
      </button>

    </div>

  </div>
  `;
}


/* =========================================================
   CREATE SET
========================================================= */

async function createSet() {

  const name =
    $('new-name').value.trim();

  const channel_id =
    $('new-channel').value.trim();

  const trigger_word =
    $('new-trigger').value.trim();

  if (!name || !channel_id || !trigger_word) {

    alert('必須項目を入力してください');

    return;
  }

  try {

    const res = await csrfFetch(
      `${API}/sets`,
      {
        method: 'POST',

        body: JSON.stringify({
          guild_id: GUILD_ID,
          name,
          channel_id,
          trigger_word
        })
      }
    );

    await checkResponse(res);

    $('new-name').value = '';
    $('new-channel').value = '';
    $('new-trigger').value = '';

    showStatus('ガチャセットを作成しました');

    await loadSets();

  } catch (error) {

    console.error(error);

    showStatus(
      `作成に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   SAVE SET
========================================================= */

async function saveSet(id) {

  const body = {};

  const name =
    $(`sname-${id}`).value.trim();

  const channel_id =
    $(`sch-${id}`).value.trim();

  const trigger_word =
    $(`str-${id}`).value.trim();

  if (name) {
    body.name = name;
  }

  if (channel_id) {
    body.channel_id = channel_id;
  }

  if (trigger_word) {
    body.trigger_word = trigger_word;
  }

  if (!Object.keys(body).length) {

    alert('変更内容がありません');

    return;
  }

  try {

    const res = await csrfFetch(
      `${API}/sets/${id}`,
      {
        method: 'PATCH',
        body: JSON.stringify(body)
      }
    );

    await checkResponse(res);

    showStatus('セットを保存しました');

    await loadSets();

  } catch (error) {

    console.error(error);

    showStatus(
      `保存に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   TOGGLE SET
========================================================= */

async function toggleSet(id, enabled) {

  try {

    const res = await csrfFetch(
      `${API}/sets/${id}`,
      {
        method: 'PATCH',
        body: JSON.stringify({
          enabled
        })
      }
    );

    await checkResponse(res);

    showStatus(
      enabled
        ? 'セットを有効化しました'
        : 'セットを無効化しました'
    );

  } catch (error) {

    console.error(error);

    showStatus(
      `変更に失敗しました: ${error.message}`,
      'error'
    );

    await loadSets();
  }
}


/* =========================================================
   DELETE SET
========================================================= */

async function deleteSet(id) {

  if (!confirm('このガチャセットを削除しますか？')) {
    return;
  }

  try {

    const res = await csrfFetch(
      `${API}/sets/${id}`,
      {
        method: 'DELETE'
      }
    );

    await checkResponse(res);

    showStatus('セットを削除しました');

    await loadSets();

  } catch (error) {

    console.error(error);

    showStatus(
      `削除に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   LOAD ITEMS
========================================================= */

async function loadItems(setId) {

  try {

    const res = await fetch(
      `${API}/sets/${setId}/items`,
      {
        credentials: 'include'
      }
    );

    await checkResponse(res);

    const items = await res.json();

    const el =
      $(`items-${setId}`);

    if (!el) {
      return;
    }

    el.innerHTML = '<b>アイテム</b>';

    for (const i of items) {

      el.insertAdjacentHTML(
        'beforeend',
        `
        <div class="item">

          <input
            id="iname-${escapeAttr(i.id)}"
            value="${escapeAttr(i.name)}"
            placeholder="アイテム名"
          >

          <input
            id="idescription-${escapeAttr(i.id)}"
            value="${escapeAttr(i.description ?? '')}"
            placeholder="説明"
          >

          <input
            id="iamount-${escapeAttr(i.id)}"
            type="number"
            min="1"
            value="${escapeAttr(i.amount)}"
            placeholder="個数"
          >

          <select id="irarity-${escapeAttr(i.id)}">

            ${[
              'common',
              'uncommon',
              'rare',
              'epic',
              'legend',
              'superlegend'
            ].map(r => `
              <option
                value="${r}"
                ${i.rarity === r ? 'selected' : ''}
              >
                ${r}
              </option>
            `).join('')}

          </select>

          <button
            onclick="saveItem(
              '${escapeJs(setId)}',
              '${escapeJs(i.id)}'
            )"
          >
            保存
          </button>

          <button
            onclick="deleteItem(
              '${escapeJs(setId)}',
              '${escapeJs(i.id)}'
            )"
          >
            削除
          </button>

        </div>
        `
      );
    }

  } catch (error) {

    console.error(error);

    showStatus(
      `アイテム取得に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   ADD ITEM
========================================================= */

async function addItem(setId) {

  const name =
    $(`new-iname-${setId}`).value.trim();

  const description =
    $(`new-idescription-${setId}`).value.trim();

  const amount =
    Number(
      $(`new-iamount-${setId}`).value
    );

  const rarity =
    $(`new-irarity-${setId}`).value;


  if (!name) {

    alert('アイテム名を入力してください');

    return;
  }


  if (!Number.isFinite(amount) || amount <= 0) {

    alert('個数は1以上にしてください');

    return;
  }


  if (
    ![
      'common',
      'uncommon',
      'rare',
      'epic',
      'legend',
      'superlegend'
    ].includes(rarity)
  ) {

    alert('レアリティが不正です');

    return;
  }


  try {

    const res = await csrfFetch(
      `${API}/sets/${setId}/items`,
      {
        method: 'POST',

        body: JSON.stringify({
          name,
          description,
          amount,
          rarity
        })
      }
    );

    await checkResponse(res);

    /*
     * 入力欄をクリア
     */
    $(`new-iname-${setId}`).value = '';
    $(`new-idescription-${setId}`).value = '';
    $(`new-iamount-${setId}`).value = '';

    showStatus('アイテムを追加しました');

    /*
     * 最新のアイテム一覧を取得
     */
    await loadItems(setId);

  } catch (error) {

    console.error(error);

    showStatus(
      `アイテム追加に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   SAVE ITEM
========================================================= */

async function saveItem(setId, itemId) {

  const name =
    $(`iname-${itemId}`).value.trim();

  const description =
    $(`idescription-${itemId}`).value.trim();

  const amount =
    Number(
      $(`iamount-${itemId}`).value
    );

  const rarity =
    $(`irarity-${itemId}`).value;


  const body = {
    name,
    description,
    amount,
    rarity
  };


  if (!name) {

    alert('アイテム名を入力してください');

    return;
  }


  if (!Number.isFinite(amount) || amount <= 0) {

    alert('個数は1以上にしてください');

    return;
  }


  try {

    const res = await csrfFetch(
      `${API}/sets/${setId}/items/${itemId}`,
      {
        method: 'PATCH',
        body: JSON.stringify(body)
      }
    );

    await checkResponse(res);

    showStatus('アイテムを保存しました');

    await loadItems(setId);

  } catch (error) {

    console.error(error);

    showStatus(
      `アイテム保存に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   DELETE ITEM
========================================================= */

async function deleteItem(setId, itemId) {

  if (!confirm('このアイテムを削除しますか？')) {
    return;
  }

  try {

    const res = await csrfFetch(
      `${API}/sets/${setId}/items/${itemId}`,
      {
        method: 'DELETE'
      }
    );

    await checkResponse(res);

    showStatus('アイテムを削除しました');

    await loadItems(setId);

  } catch (error) {

    console.error(error);

    showStatus(
      `アイテム削除に失敗しました: ${error.message}`,
      'error'
    );
  }
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escapeAttr(value) {
  return escapeHtml(value);
}


function escapeJs(value) {

  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");
}


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    /*
     * 最初にCSRFトークンを取得
     */
    await loadCsrfToken();

    /*
     * セット一覧を取得
     */
    await loadSets();

  } catch (error) {

    console.error(error);

    showStatus(
      `初期化に失敗しました: ${error.message}`,
      'error'
    );
  }
}


init();

</script>

</body>
</html>
